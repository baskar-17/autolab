function codeCauses(d){if(d.code==='P2176')return ['Throttle body carbon buildup or sticking throttle plate','Throttle body replaced or cleaned without successful idle relearn','Low battery voltage or lost learned values','Throttle actuator connector, wiring, or motor fault'];const m={Fuel:['Fuel supply or pressure problem','Pump, injector or regulator fault','Damaged wiring or connector'],Ignition:['Ignition coil or spark plug problem','Wiring or coil driver fault','Fuel or compression issue may also contribute'],Sensors:['Sensor or connector issue','Signal, reference supply or ground wiring fault','Mechanical signal target problem where applicable'],Network:['Module power or ground issue','CAN communication wiring or connector fault','A module may be offline or not responding'],Electrical:['Low supply voltage or poor ground','Relay, fuse or wiring problem','Control module fault after other checks'],ABS:['Wheel sensor, ABS wiring or module issue','Poor connector or supply','Mechanical wheel/reluctor problem'],Airbag:['Airbag deployment circuit wiring or connector issue','Restraint control module or component fault'],Transmission:['Transmission sensor, actuator or hydraulic fault','Electrical connector or wiring problem','Mechanical transmission issue'],Emissions:['Emissions system leak or sensor fault','Related valve, catalyst or wiring issue'],Air:['Airflow or pressure sensor fault','Intake leak or restriction','Sensor wiring issue'],Throttle:['Throttle body or pedal sensor issue','Connector, motor or signal fault'],Cooling:['Thermostat, fan or coolant sensor fault','Cooling system wiring or control issue'],Timing:['Variable valve timing control or oil problem','Cam/crank correlation or mechanical timing issue'],Starting:['Starter relay or control wiring fault','Battery supply, ground or safety interlock issue'],Chassis:['Chassis module, sensor or communication issue']};return m[d.system]||['Relevant sensor, actuator or wiring fault','Power, ground or module issue function codeChecks(d){if(d.code==='P2176')return ['Record other DTCs and freeze-frame data; check battery voltage.','Inspect throttle body and connector; check for sticking or contamination without forcing an electronic throttle plate.','Follow the vehicle manufacturer’s idle/throttle relearn procedure with a compatible scan tool if required.','If relearn fails, diagnose actuator commands, position feedback, wiring, and air leaks using service information.'];if(d.family==='U')return ['Read all modules and record which one stored the code.','Check battery voltage, module fuses and grounds.','Inspect relevant connectors and CAN wiring using the correct diagram.'];if(d.family==='B')return ['Read the affected body or safety module with a compatible scanner.','Check the manufacturer-specific code definition and service information.','For airbag circuits, follow professional SRS safety procedures; do not probe deployment circuits.'];if(d.family==='C')return ['Read ABS/chassis module data and freeze-frame details.','Inspect the indicated sensor, connector and wiring.','Test circuit and live signals using vehicle-specific procedures.'];return ['Record freeze-frame data and check for related fault codes.','Inspect the relevant component, wiring, power and ground.','Measure signals or pressures with the correct tool before replacing parts.']}
function codeCard(d){return `<button class="card" data-dtc="${d.code}"><div class="body"><div class="eyebrow">${categoryNames[d.family]} · ${esc(d.system)}</div><h3 class="orange">${d.code}</h3><p>${esc(d.name)}</p><div class="link">View details →</div></div></button>`}
function library(){active=null;selectedCode=null;stop();app.innerHTML=`<button class="back" id="backhome">← Component lessons</button><section class="hero"><div class="eyebrow">DIAGNOSTIC REFERENCE</div><h1>OBD-II <span class="orange">Error Code Library</span></h1><p class="muted">Search a code or description. Browse ${dtcs.length} curated code definitions by category. This is a limited reference, not a complete OBD-II database. Missing results do not mean a code is invalid.</p><span class="stat">${dtcs.length} searchable codes</span><span class="stat">4 code families</span></section><input id="dtcsearch" class="search" placeholder="Search P0337, U0100, misfire, crankshaft..." value="${esc(codeQuery)}" aria-label="Search diagnostic codes"><div class="chips">${['All','P','B','C','U'].map(c=>`<button class="chip ${codeCategory===c?'active':''}" data-codecat="${c}">${c==='All'?'All codes':c+' — '+categoryNames[c]}</button>`).join('')}</div><p id="resultcount" class="muted small"></p><div class="cards" id="dtccards"></div><div class="note" style="margin-top:24px">Generic definitions may vary by standard revision. B, C and manufacturer-specific codes can have different meanings by vehicle. Confirm against the manufacturer service manual before repairs.</div>`;document.getElementById('backhome').onclick=home;document.getElementById('dtcsearch').oninput=e=>{codeQuery=e.target.value;renderCodes()};document.querySelectorAll('[data-codecat]').forEach(b=>b.onclick=()=>{codeCategory=b.dataset.codecat;library()});renderCodes()}
function renderCodes(){let q=codeQuery.trim().toLowerCase();let arr=dtcs.filter(d=>(codeCategory==='All'||d.family===codeCategory)&&(d.code.toLowerCase().includes(q)||d.name.toLowerCase().includes(q)||d.system.toLowerCase().includes(q)));document.getElementById('resultcount').textContent=`${arr.length} matching code${arr.length===1?'':'s'}`;document.getElementById('dtccards').innerHTML=arr.slice(0,120).map(codeCard).join('')||(q?`<div class="panel"><h3>No verified match for “${esc(codeQuery)}”</h3><p class="muted">Try the exact five-character code. This version contains a curated selection, not every manufacturer-specific DTC.</p></div>`:'<p class="muted">No codes in this category.</p>');document.querySelectorAll('[data-dtc]').forEach(b=>b.onclick=()=>codeDetail(b.dataset.dtc))}
function componentGuide(d){
const sys=d.system.toLowerCase(), n=d.name.toLowerCase();
let target='Related component',hint='Location depends on the vehicle; consult a model-specific service diagram.',kind='generic';
if(d.code==='P2176'||sys==='throttle'||n.includes('throttle')){target='Electronic throttle body';hint='Usually where the large air-intake hose meets the intake manifold. Look for a round metal housing with an electrical connector.';kind='throttle'}
else if(sys==='fuel'||n.includes('fuel pump')){target='Fuel system';hint='The fuel pump is commonly inside the fuel tank, not under the bonnet. Other fuel components may be on the engine.';kind='fuel'}
else if(sys==='ignition'||n.includes('misfire')){target='Ignition coils / spark plugs';hint='On many petrol engines, ignition coils sit along the top of the engine under a cover. Diesel engines differ.';kind='ignition'}
else if(n.includes('crankshaft')||n.includes('camshaft')||sys==='sensors'){target='Engine position sensor';hint='Crank sensors are often low on the engine near the crankshaft pulley or bellhousing; cam sensors are often near the cylinder head.';kind='sensor'}
else if(sys==='electrical'||n.includes('battery')){target='Battery / fuse box';hint='Usually near one side of the engine bay; some vehicles put the battery elsewhere.';kind='electrical'}
else if(sys==='starting'){target='Starter motor';hint='Often mounted low where the engine joins the transmission; it may not be visible from above.';kind='starter'}
else if(d.family==='U'){target='Electronic control modules';hint='ECU locations vary: engine bay, cabin, or behind trim. A communication code does not identify a single failed module.';kind='module'}
else if(d.family==='B'){target='Body / cabin system';hint='Many body components are inside the cabin, doors or dashboard rather than under the bonnet.';kind='body'}
else if(d.family==='C'){target='Chassis / wheel system';hint='Many ABS, steering and suspension components are near the wheels or under the vehicle.';kind='chassis'}
const pos={throttle:[315,128],fuel:[68,194],ignition:[234,116],sensor:[252,200],electrical:[74,110],starter:[257,214],module:[72,110],body:[315,128],chassis:[68,194],generic:[234,116]}[kind];
const [cx,cy]=pos;
return `<div class="panel"><h3>🔎 Find the component — illustrated guide</h3><p class="muted">Simplified top-down engine-bay sketch, not a photograph or vehicle-specific layout.</p><svg viewBox="0 0 440 265" role="img" aria-label="Illustrative engine bay showing approximate component area" style="width:100%;max-width:650px;background:#121927;border-radius:14px;display:block;margin:12px auto"><rect x="12" y="12" width="416" height="241" rx="22" fill="#222d3d" stroke="#6b7686" stroke-width="3"/><rect x="146" y="60" width="166" height="161" rx="20" fill="#4b596b" stroke="#b6c0cb" stroke-width="3"/><rect x="170" y="79" width="120" height="118" rx="14" fill="#303e50"/><text x="230" y="142" fill="#e4ebf5" text-anchor="middle" font-size="18" font-weight="bold">ENGINE</text><rect x="34" y="78" width="82" height="66" rx="8" fill="#37495c" stroke="#8c9daf" stroke-width="3"/><text x="75" y="112" fill="#e4ebf5" text-anchor="middle" font-size="12">Battery /</text><text x="75" y="128" fill="#e4ebf5" text-anchor="middle" font-size="12">fuses</text><rect x="26" y="171" width="85" height="54" rx="10" fill="#354458" stroke="#8c9daf" stroke-width="3"/><text x="68" y="202" fill="#e4ebf5" text-anchor="middle" font-size="12">Other</text><path d="M315 127 H352 V71 H407" stroke="#8c9daf" stroke-width="24" fill="none" stroke-linecap="round"/><text x="365" y="55" fill="#e4ebf5" text-anchor="middle" font-size="12">Air intake</text><circle cx="${cx}" cy="${cy}" r="23" fill="#ff9c28" fill-opacity=".22" stroke="#ff9c28" stroke-width="4"/><circle cx="${cx}" cy="${cy}" r="7" fill="#ff9c28"/><text x="220" y="246" text-anchor="middle" fill="#bdc8d7" font-size="11">Front of vehicle (illustrative)</text></svg><p><strong>Look for:</strong> ${esc(target)}</p><p class="muted">${esc(hint)}</p><div class="note">⚠️ The orange marker indicates a learning example, not a reliable location for your exact car. Some parts are underneath the vehicle or inside the cabin. Never touch moving or hot components.</div><a class="link" href="https://www.youtube.com/results?search_query=${encodeURIComponent(target+' where is it located in car engine bay')}" target="_blank" rel="noopener">Watch component location demonstrations ↗</a></div>`;
}
function codeDetail(code){let d=dtcs.find(x=>x.code===code);if(!d)return;selectedCode=d;app.innerHTML=`<button class="back" id="backcodes">← Error code library</button><div class="eyebrow">${categoryNames[d.family]} / ${esc(d.system)}</div><h1><span class="orange">${d.code}</span></h1><h2>${esc(d.name)}</h2>${componentGuide(d)}<div class="panel"><h3>What does it mean?</h3><p>The vehicle has detected a fault condition involving the ${esc(d.system.toLowerCase())} system. This code identifies a diagnostic direction, not a confirmed failed part.</p></div><div class="panel"><h3>Possible causes to investigate</h3><ol>${codeCauses(d).map(x=>`<li style="padding:5px 0">${esc(x)}</li>`).join('')}</ol></div><div class="panel"><h3>First diagnostic checks</h3><ol>${codeChecks(d).map(x=>`<li style="padding:5px 0">${esc(x)}</li>`).join('')}</ol></div><div class="panel"><h3>Learn more</h3><a class="link" href="https://www.youtube.com/results?search_query=${encodeURIComponent(d.code+' automotive diagnosis explained')}" target="_blank" rel="noopener">Find explanatory videos on YouTube ↗</a></div><div class="note">Do not replace a part solely because its name appears in the code. Some faults have multiple possible causes. For safety-critical systems, use qualified service procedures.</div>`;document.getElementById('backcodes').onclick=library}

let active=null,tab='Overview',filter='All',query='',choice=-1,submitted=false;const done=new Set(JSON.parse(localStorage.getItem('autolab-progress')||'[]'));const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function art(x){return `<div class="art" style="--shade:${x.shade}">${x.icon}</div>`}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel()}const vehicleStorageKey='autolab-vehicle-v1';
let vehicle=(()=>{try{return JSON.parse(localStorage.getItem(vehicleStorageKey)||'null')}catch{return null}})();
function vehicleSummary(){return vehicle&&vehicle.make&&vehicle.model&&vehicle.year?esc(vehicle.year+' '+vehicle.make+' '+vehicle.model+(vehicle.engine?' · '+vehicle.engine:'')):'No vehicle selected'}
function vehicleSelector(){return `<div class="panel"><h3>🚗 Your vehicle <span style="font-size:12px;color:#b9c3d2;font-weight:normal">— optional</span></h3><p class="muted">Save your vehicle for future model-specific lessons. This release still shows general guidance until verified vehicle-specific diagrams are available.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px"><label>Make<input class="search" id="v-make" maxlength="60" placeholder="e.g. Maruti Suzuki" value="${esc(vehicle?.make||'')}"></label><label>Model<input class="search" id="v-model" maxlength="60" placeholder="e.g. Swift" value="${esc(vehicle?.model||'')}"></label><label>Year<input class="search" id="v-year" type="number" min="1980" max="2030" placeholder="e.g. 2022" value="${esc(vehicle?.year||'')}"></label><label>Engine / fuel<input class="search" id="v-engine" maxlength="80" placeholder="e.g. 1.2L petrol" value="${esc(vehicle?.engine||'')}"></label></div><button class="primary" id="savevehicle" style="margin-top:12px">Save vehicle</button> <button class="chip" id="clearvehicle" style="margin-top:12px">Clear</button><p class="muted" id="vehiclefeedback" aria-live="polite">Selected: ${vehicleSummary()}</p></div>`}
function wireVehicleSelector(){const save=document.getElementById('savevehicle'),clear=document.getElementById('clearvehicle');if(!save)return;save.onclick=()=>{const val=id=>document.getElementById(id).value.trim();const make=val('v-make'),model=val('v-model'),year=val('v-year'),engine=val('v-engine');const yr=Number(year);if(!make||!model||!/^\\d{4}$/.test(year)||yr<1980||yr>2030){document.getElementById('vehiclefeedback').textContent='Enter make, model and a valid four-digit year (1980–2030).';return}vehicle={make,model,year,engine};localStorage.setItem(vehicleStorageKey,JSON.stringify(vehicle));document.getElementById('vehiclefeedback').textContent='Saved: '+year+' '+make+' '+model+(engine?' · '+engine:'')};clear.onclick=()=>{vehicle=null;localStorage.removeItem(vehicleStorageKey);for(const id of ['v-make','v-model','v-year','v-engine'])document.getElementById(id).value='';document.getElementById('vehiclefeedback').textContent='Vehicle cleared.'}}
function home(){active=null;const cats=['All','Electrical','Starting','Fuel','Sensors','Ignition','Air'];app.innerHTML=`<section class="hero"><div class="eyebrow">AUTOMOTIVE LEARNING • FROM ZERO</div><h1>Understand every part.<br><span class="orange">Diagnose with confidence.</span></h1><p class="muted">Interactive component lessons, narrated explanations, OBD codes, diagnostic checklists and quizzes.</p><span class="stat">📚 ${data.length} lessons</span><span class="stat">✓ ${done.size} completed</span><div class="progress"><div style="width:${done.size/data.length*100}%"></div></div></section>${vehicleSelector()}<div class="panel"><h2>🔎 OBD-II Error Code Library</h2><p class="muted">Browse codes in Powertrain, Body, Chassis and Network categories, or search by exact code.</p><button class="primary" id="openlibrary">Explore all error codes →</button></div><h2>Explore components</h2><input class="search" id="search" placeholder="Search components or codes, e.g. U0100" value="${esc(query)}"><div class="chips">${cats.map(c=>`<button class="chip ${filter===c?'active':''}" data-filter="${c}">${c}</button>`).join('')}</div><div class="cards" id="cards"></div>`;wireVehicleSelector();document.getElementById('openlibrary').onclick=library;const inp=document.getElementById('search');inp.oninput=e=>{query=e.target.value;cards()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;home()});cards()}function cards(){let visible=data.filter(x=>(filter==='All'||x.cat===filter)&&(x.name+' '+x.desc+' '+x.codes.join(' ')).toLowerCase().includes(query.toLowerCase()));document.getElementById('cards').innerHTML=(query.trim()?dtcs.filter(d=>(d.code+' '+d.name+' '+d.system).toLowerCase().includes(query.toLowerCase())).slice(0,12).map(codeCard).join(''):'')+visible.map(x=>`<button class="card" data-id="${x.id}">${art(x)}<div class="body"><div class="eyebrow">${esc(x.cat.toUpperCase())} · ${done.has(x.id)?'✓ COMPLETED':'BEGINNER'}</div><h3>${esc(x.name)}</h3><p>${esc(x.desc)}</p><div class="link">View details →</div></div></button>`).join('')||'<p class="muted">No matching lessons.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>open(b.dataset.id));document.querySelectorAll('[data-dtc]').forEach(b=>b.onclick=()=>codeDetail(b.dataset.dtc))}function open(id){active=data.find(x=>x.id===id);tab='Overview';choice=-1;submitted=false;detail()}function detail(){let x=active;app.innerHTML=`<button class="back" id="back">← All components</button><div class="detail"><div><div class="eyebrow">${x.cat.toUpperCase()} • BEGINNER LESSON</div><h1>${esc(x.name)}</h1><p class="muted">${esc(x.desc)}</p>${x.codes.map(c=>`<span class="code">${c}</span>`).join('')}</div>${art(x)}</div><div class="tabs">${['Overview','Video & audio','Fault codes','Diagnostics','Quiz'].map(t=>`<button class="tab ${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</div><div id="panel"></div>`;document.getElementById('back').onclick=()=>{stop();home()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{stop();tab=b.dataset.tab;detail()});panel()}function panel(){let x=active,p=document.getElementById('panel');if(tab==='Overview')p.innerHTML=`<div class="panel"><div class="eyebrow">EXPLAINED SIMPLY</div><h2>What is it?</h2><p>${esc(x.intro)}</p><button class="primary" id="speak">▶ Listen to explanation</button></div><div class="panel"><h3>Possible symptoms</h3><ul>${x.symptoms.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`;if(tab==='Video & audio')p.innerHTML=`<div class="panel"><h2>Watch a video lesson</h2><p class="muted small">Open free-to-watch educational videos on YouTube. Videos are third-party content; availability and reuse permissions vary.</p><a class="primary" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(x.name+' automotive explained beginner')}">Find video lessons ↗</a></div><div class="panel"><h2>Audio lesson</h2><p>${esc(x.intro)}</p><button class="primary" id="speak">▶ Play narration</button><p class="muted small">Audio uses the speech voices available in your browser.</p></div>`;if(tab==='Fault codes')p.innerHTML=`<div class="panel"><h2>Related OBD codes</h2>${x.codes.map(c=>`<span class="code">${c}</span>`).join('')}<p class="muted small">These codes may involve this system. A fault code does not prove a component has failed.</p></div>`;if(tab==='Diagnostics')p.innerHTML=`<div class="panel"><h2>Diagnostic checklist</h2><ol>${x.steps.map(s=>`<li style="padding:7px 0">${esc(s)}</li>`).join('')}</ol></div><div class="note">Do not use resistance mode on a powered circuit. Use vehicle-specific wiring diagrams before testing ECU connector pins.</div>`;if(tab==='Quiz')p.innerHTML=`<div class="panel"><div class="eyebrow">KNOWLEDGE CHECK</div><h2>${esc(x.question)}</h2>${x.options.map((o,i)=>`<button class="answer ${choice===i?'chosen':''}" data-answer="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}<button class="primary" id="check" ${choice<0?'disabled':''}>Check answer</button>${submitted?`<p class="feedback">${choice===x.correct?'✓ Correct! Lesson completed.':'Not quite. Correct answer: '+esc(x.options[x.correct])}</p>`:''}</div>`;let sp=document.getElementById('speak');if(sp)sp.onclick=()=>{if(!('speechSynthesis'in window)){sp.textContent='Audio not supported here';return}stop();let u=new SpeechSynthesisUtterance(x.name+'. '+x.intro+' Possible symptoms: '+x.symptoms.join(', '));u.rate=.88;speechSynthesis.speak(u);sp.textContent='◼ Stop audio';sp.onclick=()=>{stop();sp.textContent='▶ Play narration'}};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{choice=Number(b.dataset.answer);submitted=false;panel()});let ck=document.getElementById('check');if(ck)ck.onclick=()=>{submitted=true;if(choice===x.correct){done.add(x.id);localStorage.setItem('autolab-progress',JSON.stringify([...done]))}panel()}}home();
</script></body></html>
